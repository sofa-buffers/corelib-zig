name: "Version consistency"

# The git tag is the source of truth for the version: every file that states the
# version must match it. In this repo that is two places, each checked in its own
# step:
#   - build.zig.zon — the package manifest's `.version`;
#   - README.md     — the pinned ref in the `zig fetch … #vX.Y.Z` install line.
# A new place that carries the version needs a step here and a row in the
# /release skill's table (.claude/skills/release/SKILL.md).
#
# Tags only: the comparison is only meaningful when there is a tag to compare
# against. Between releases `build.zig.zon` may legitimately sit ahead of the
# newest tag, so running this on every push and pull request produced noise,
# not signal — and cost a runner slot per run.
on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-versions:
    name: Check versions
    runs-on: ubuntu-latest
    # Bounded like every other job in this repo: a checkout plus two greps has
    # no business holding one of the account's 20 concurrent slots for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need tags for the reference version

      - name: Reference version (git tag)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            ref_version=${GITHUB_REF_NAME#v}
          else
            # Latest tag on a manual/branch run; empty if the repo has no tags
            # yet, in which case the comparison is skipped.
            ref_version=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
            [[ -n "$ref_version" ]] || echo "::notice::no git tag found; skipping version comparison"
          fi
          echo "REF_VERSION=$ref_version" >> "$GITHUB_ENV"

      # Release tags are a lowercase `v` plus plain semver: `v1.2.3`. `v*` also
      # matches `v1.2`, `v1.2.3-rc1` or `vfoo`; none of those is a release here.
      - name: Check tag name (vX.Y.Z)
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$GITHUB_REF_NAME' is not of the form vX.Y.Z (lowercase v, plain semver)"; exit 1; }
          echo "tag: $GITHUB_REF_NAME"

      - name: Check Zig package manifest (build.zig.zon)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # `.version = "x.y.z",` on its own line in the ZON manifest.
          version=$(grep -oP '^\s*\.version\s*=\s*"\K[^"]+' build.zig.zon | head -1)
          [[ -n "$version" ]] || { echo "::error::build.zig.zon: no .version field found"; exit 1; }
          [[ -z "$REF_VERSION" || "$version" == "$REF_VERSION" ]] || { echo "::error::build.zig.zon version: '$version' != '$REF_VERSION'"; exit 1; }
          echo "build.zig.zon version: $version"

      - name: Check README install ref (README.md)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # Every `zig fetch` of this repo in the README pins a `#vX.Y.Z` ref, and
          # every such ref must be the tag. There must be at least one: a README
          # that lost its pinned install line would otherwise pass silently.
          mapfile -t refs < <(grep -oP 'zig fetch\b.*github\.com/sofa-buffers/corelib-zig#v\K[^\s`]+' README.md || true)
          (( ${#refs[@]} > 0 )) || { echo "::error file=README.md::no pinned 'zig fetch … corelib-zig#vX.Y.Z' install line found"; exit 1; }
          if grep -nP 'zig fetch\b.*github\.com/sofa-buffers/corelib-zig(?!#v)' README.md; then
            echo "::error file=README.md::a 'zig fetch' of corelib-zig without a #vX.Y.Z ref"; exit 1
          fi
          for v in "${refs[@]}"; do
            [[ -z "$REF_VERSION" || "$v" == "$REF_VERSION" ]] || { echo "::error file=README.md::README zig fetch ref: 'v$v' != 'v$REF_VERSION'"; exit 1; }
          done
          echo "README.md zig fetch ref(s): ${refs[*]/#/v}"
