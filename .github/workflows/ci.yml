name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref. A superseded pull-request run is cancelled rather
# than left to hold runners the newer push needs; main is never cancelled, so
# every commit on it keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ZIG_VERSION: 0.16.0

# Every job below carries a `timeout-minutes`. A hung step has to fail fast and
# say which job it was: the account's Actions concurrency is 20, so a wedged job
# is a slot every other repository in the family queues behind — and GitHub's
# default cap of 360 minutes holds that slot for six hours.

jobs:
  # Formatting, denying any unformatted file.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~15 s observed
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig src tests bench

  # Compile-only gate between the lint and the test fan-out. `zig build` takes
  # ~20 s while `zig build test` needs ~28 s more on top, and behind the fan-out
  # sits the 32-bit pair and a QEMU s390x leg — so a plain compile error is
  # cheapest to learn about here, once, instead of six times in parallel.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~30 s observed
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build

  # Build + full test suite (incl. the shared vectors from assets/) in both
  # optimize modes: Debug keeps all safety checks; ReleaseFast is the shipping
  # config this port is tuned for.
  #
  # A single pinned toolchain, deliberately. `build.zig.zon` declares
  # `minimum_zig_version = 0.16.0` and 0.16.0 is the current stable, so there
  # is no older-stable leg to add — pre-0.16 compilers are rejected by the
  # package manager, not merely untested. A `master` (0.17-dev) leg is left
  # out on purpose too: CI exists to test this implementation, not to track
  # upstream's development branch, and a nightly that moves under us produces
  # red checks nobody can act on. The 0.17 migration is handled when 0.17
  # ships.
  test:
    name: Test (x86_64, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15   # ~1.5 min observed per leg
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        run: zig build ${{ matrix.mode == 'release' && '--release=fast' || '' }}
      - name: Test
        run: zig build test ${{ matrix.mode == 'release' && '--release=fast' || '' }}

  # Same suite on a big-endian host (IBM Z / s390x) under QEMU, proving the
  # little-endian wire format round-trips correctly off little-endian hardware.
  test-big-endian:
    name: Test (s390x big-endian)
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ~4.5 min observed (QEMU emulation)
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Retried: a stalled apt mirror is the one step in this job that has
      # actually wedged, and it fails by hanging rather than by erroring.
      - name: Install QEMU user emulation
        run: |
          ok=
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y qemu-user-static; then ok=1; break; fi
            echo "::warning::attempt $i failed, retrying in 15s"
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::giving up after 3 attempts"; exit 1; }
          # Zig invokes the interpreter as `qemu-s390x`; Ubuntu ships it as
          # `qemu-s390x-static`.
          sudo ln -sf /usr/bin/qemu-s390x-static /usr/local/bin/qemu-s390x
      - run: zig build test -Dtarget=s390x-linux -fqemu

  # Same suite on a 32-bit target, pinning down the places where the port would
  # otherwise silently assume a 64-bit `usize`: length/offset arithmetic, varint
  # decode into `usize`, and any capacity bound that only overflows when
  # `usize` is 32 bits wide. x86-linux binaries execute directly on the 64-bit
  # runner (freestanding static Zig binaries need no 32-bit userland), so this
  # leg needs no QEMU and runs at full speed. Both optimize modes are covered:
  # Debug catches the overflow via safety checks, ReleaseFast proves the
  # shipping config still round-trips.
  test-32bit:
    name: Test (x86 32-bit, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~40 s observed per leg
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Dtarget=x86-linux ${{ matrix.mode == 'release' && '--release=fast' || '' }}

  # Line coverage via kcov over the test binaries; publishes the README's
  # coverage badge from main.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20   # ~2 min observed, dominated by the kcov source build
    # Deliberately not `needs: [build]`. This job builds and runs everything
    # itself under kcov, so it uses nothing that job produces. Waiting for it
    # started coverage at +204 s on the last run and ended it at +384, while
    # every other job was done by +293.
    needs: [lint]
    permissions:
      contents: write   # push the badge JSON to the `badges` branch
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # kcov is not packaged for Ubuntu 24.04 — build the pinned release.
      # kcov is pinned to v43 and was rebuilt from source on every run: 149 of
      # this job's 180 seconds went into that, against 10 seconds of actual
      # measuring. The build tree is cached on the version now, so a hit skips
      # the download, the cmake configure and the compile.
      - name: Install kcov's build and runtime dependencies
        run: |
          ok=
          for i in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
                 cmake g++ binutils-dev libdw-dev libiberty-dev \
                 libcurl4-openssl-dev zlib1g-dev libssl-dev jq; then ok=1; break; fi
            echo "::warning::apt attempt $i failed, retrying in 15s"
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::giving up after 3 apt attempts"; exit 1; }

      - name: Cache the kcov build
        id: kcov-cache
        uses: actions/cache@v6
        with:
          path: /tmp/kcov-43/build
          key: kcov-43-${{ runner.os }}

      - name: Build kcov
        if: steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          ok=
          for i in 1 2 3; do
            if curl -fsSL https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz | tar xz -C /tmp; then ok=1; break; fi
            echo "::warning::kcov download attempt $i failed, retrying in 15s"
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::giving up after 3 download attempts"; exit 1; }
          cmake -S /tmp/kcov-43 -B /tmp/kcov-43/build -DCMAKE_BUILD_TYPE=Release
          make -C /tmp/kcov-43/build -j"$(nproc)"

      # Runs on a cache hit too: the cache holds the build tree, not the
      # installed binary.
      - name: Install kcov
        run: |
          sudo make -C /tmp/kcov-43/build install
          kcov --version

      - name: Measure coverage
        run: |
          ./coverage.sh
          PCT=$(jq -r '.percent_covered' "$(find coverage/merged -name coverage.json | head -1)")
          echo "COVERAGE_PCT=$PCT" >> "$GITHUB_ENV"

      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-coverage-badge.sh
